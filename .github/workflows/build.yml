name: Build TaskFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaskFlow.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: TaskFlow.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: TaskFlow v2.0.${{ github.run_number }}
          body: |
            🚀 TaskFlow Android APK

            Built entirely on phone using GitHub Actions!

            Download TaskFlow.apk below.
          files: TaskFlow.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
