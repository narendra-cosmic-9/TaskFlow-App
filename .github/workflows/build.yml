name: Build TaskFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make dummy files for CI
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.cosmic.taskflow"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          if [ ! -f .env ]; then echo "DUMMY=dummy" > .env; fi
          cp .env app/.env 2>/dev/null || true

      - name: Build Debug APK (works even if gradlew missing)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
            cd app
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, using gradle directly"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
